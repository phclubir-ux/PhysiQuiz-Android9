name: Build PhysiQuiz APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # NOTE: no manual "recreate the project structure" step here on purpose.
      # This repo already has a real Gradle module (app/src/main/java/...,
      # app/build.gradle, build.gradle, settings.gradle) checked in — Gradle
      # builds directly from that. A script that copies files into a
      # freshly-made folder on every run is fragile: any file the script
      # forgets to list (like AppConfig.java before) silently goes missing
      # from the build, and any build.gradle it regenerates overrides the
      # real one in the repo.
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PhysiQuiz.apk
          sha256sum dist/PhysiQuiz.apk > dist/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhysiQuiz-APK
          path: dist/
          retention-days: 30
